name: sicsa-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-10m}
    max-file: ${LOG_MAX_FILES:-5}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME:?SERVER_NAME es obligatorio}
      NGINX_ENVSUBST_FILTER: SERVER_NAME
    volumes:
      - ./deploy/nginx/templates:/etc/nginx/templates:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks:
      - proxy
    logging: *default-logging

  frontend:
    build:
      context: ./sicsa-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL es obligatoria}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?NEXT_PUBLIC_SOCKET_URL es obligatoria}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL es obligatoria}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:?NEXT_PUBLIC_SOCKET_URL es obligatoria}
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - proxy
    logging: *default-logging

  backend:
    build:
      context: ./sicsa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      ai:
        condition: service_healthy
      n8n:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME es obligatoria}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE es obligatoria}
      DB_SYNCHRONIZE: "false"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatoria}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1h}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY es obligatoria}
      OTP_HMAC_SECRET: ${OTP_HMAC_SECRET:?OTP_HMAC_SECRET es obligatoria}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS es obligatoria}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-900}
      AUTH_LOGIN_BLOCK_SECONDS: ${AUTH_LOGIN_BLOCK_SECONDS:-900}
      AUTH_GENERAL_IP_LIMIT: ${AUTH_GENERAL_IP_LIMIT:-20}
      AUTH_CODE_MAX_ATTEMPTS: ${AUTH_CODE_MAX_ATTEMPTS:-10}
      AUTH_CODE_RESEND_COOLDOWN_SECONDS: ${AUTH_CODE_RESEND_COOLDOWN_SECONDS:-60}
      AI_SERVICE_URL: http://ai:8000
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-3000}
      N8N_INTERNAL_TOKEN: ${N8N_INTERNAL_TOKEN:?N8N_INTERNAL_TOKEN es obligatoria}
      N8N_TIMEOUT_MS: ${N8N_TIMEOUT_MS:-5000}
      N8N_EMAIL_WEBHOOK_URL: http://n8n:5678/webhook/verificacion-aprobada
      N8N_VERIFICATION_CODE_WEBHOOK_URL: http://n8n:5678/webhook/verificacion-codigo-email
      N8N_APPOINTMENT_CREATED_WEBHOOK_URL: http://n8n:5678/webhook/cita-creada
      N8N_WAITLIST_ASSIGNED_WEBHOOK_URL: http://n8n:5678/webhook/lista-espera-asignada
      N8N_REMINDER_WEBHOOK_URL: http://n8n:5678/webhook/recordatorio-cita
      N8N_PASSWORD_RESET_WEBHOOK_URL: http://n8n:5678/webhook/recuperar-contrasena
      N8N_SMS_WEBHOOK_URL: http://n8n:5678/webhook/sicsa-sms
      SMS_PROVIDER_MODE: n8n
      SMS_TIMEOUT_MS: ${SMS_TIMEOUT_MS:-5000}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks:
      - proxy
      - internal
    logging: *default-logging

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD es obligatoria}
      MYSQL_DATABASE: ${DB_DATABASE:?DB_DATABASE es obligatoria}
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME es obligatoria}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria}
    volumes:
      - mysql_prod_data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - internal
    logging: *default-logging

  ai:
    build:
      context: ./sicsa-ai
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - internal
    logging: *default-logging

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      N8N_SECURE_COOKIE: "true"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY es obligatoria}
      N8N_INTERNAL_TOKEN: ${N8N_INTERNAL_TOKEN:?N8N_INTERNAL_TOKEN es obligatoria}
      N8N_HOST: ${SERVER_NAME:?SERVER_NAME es obligatorio}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      N8N_EDITOR_BASE_URL: https://${SERVER_NAME}/n8n/
      WEBHOOK_URL: https://${SERVER_NAME}/
    volumes:
      - n8n_prod_data:/home/node/.n8n
    expose:
      - "5678"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - internal
      - egress
    logging: *default-logging

volumes:
  mysql_prod_data:
  n8n_prod_data:

networks:
  proxy:
  internal:
    internal: true
  egress:
